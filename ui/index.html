<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-up Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ 页面 1：启动器（顶栏由常驻 controls webview 提供） ============ -->
  <div id="launcher">
    <main id="launcher-main">
      <div id="launcher-meta">
        <span id="version-badge" class="muted"></span>
        <button id="btn-check-update" class="chip-btn" onclick="UI.manualCheckUpdate()">检查更新</button>
        <span id="update-badge" class="update-badge hidden">⚠ 可更新</span>
      </div>
      <div id="toast" class="hidden"></div>

      <div id="checking-view" class="center-view">
        <div class="spinner"></div>
        <p class="muted">正在检查环境…</p>
      </div>

      <div id="action-view" class="center-view hidden">
        <button id="btn-node" class="action-btn hidden">
          <span class="icon">⬇</span><span class="t">安装 Node.js</span>
          <span class="sub">DSH 运行所需环境</span>
        </button>

        <button id="btn-dsh" class="action-btn hidden">
          <span class="icon">⬇</span><span class="t">安装 DeepSeek Harness</span>
          <span class="sub">npm 全局安装 @deepseek-ai/dsh</span>
        </button>

        <button id="btn-core" class="action-btn hidden">
          <span class="icon">⚡</span><span class="t" id="core-label">启动 dsh 核心</span>
        </button>

        <button id="btn-open" class="action-btn disabled hidden">
          <span class="icon">🌐</span><span class="t">打开 dsh</span>
          <span class="sub" id="open-sub">等待核心启动…</span>
        </button>

        <div id="busy-view" class="hidden">
          <div class="spinner"></div>
          <p class="muted" id="busy-text">处理中…</p>
        </div>

        <button id="btn-settings" class="action-btn hidden" onclick="UI.openSettings()">
          <span class="icon">⚙</span><span class="t">设置</span>
        </button>

        <button id="btn-uninstall" class="action-btn">
          <span class="icon">🗑</span><span class="t">卸载 DeepSeek Harness</span>
        </button>
      </div>
    </main>
  </div>

  <!-- ============ 页面 2：DSH 全窗口内嵌 ============ -->
  <div id="dsh-page" class="hidden">
    <div id="dsh-slot">
      <div id="dsh-loading" class="center-view">
        <div class="spinner"></div>
        <p class="muted">正在启动 DSH…</p>
      </div>
    </div>
  </div>

  <!-- 更新确认弹窗 -->
  <div id="modal-update" class="hidden">
    <div class="modal-card">
      <h3>更新 DeepSeek Harness</h3>
      <p class="muted" id="update-info">…</p>
      <div class="modal-actions">
        <button class="btn" onclick="UI.closeUpdateModal()">取消</button>
        <button class="btn primary" id="btn-do-update" onclick="UI.doUpdate()">立即更新</button>
      </div>
      <div id="update-log" class="log"></div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="modal-settings" class="hidden">
    <div class="modal-card">
      <h3>设置</h3>
      <p class="muted">✕ 关闭行为</p>
      <label class="chk"><input type="radio" name="close-mode" value="exit" /> 退出主程序（同时结束 dsh）</label>
      <label class="chk"><input type="radio" name="close-mode" value="minimize" /> 隐藏到任务栏托盘（dsh 继续运行）</label>
      <p class="muted">启动器壁纸</p>
      <div class="row">
        <span class="muted" id="bg-status">默认壁纸</span>
        <label class="btn file-btn">选择图片…
          <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp" style="display:none" />
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="UI.closeSettings()">关闭</button>
        <button class="btn primary" onclick="UI.saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- 卸载确认弹窗 -->
  <div id="modal" class="hidden">
    <div class="modal-card">
      <h3>卸载 DeepSeek Harness</h3>
      <p class="muted">将移除全局安装的 @deepseek-ai/dsh。不勾选时用户配置完整保留。</p>
      <label class="chk"><input type="checkbox" id="chk-config" /> 同时清除用户配置（~/.dsh：profiles、会话记录）</label>
      <label class="chk"><input type="checkbox" id="chk-npx" /> 同时清理 npx 残留缓存</label>
      <div class="modal-actions">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn danger" onclick="UI.doUninstall()">确认卸载</button>
      </div>
      <div id="modal-log" class="log"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

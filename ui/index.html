<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-up Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <span class="brand">⚡ dsh-up</span>
    <span id="dsh-status" class="status status-idle">检测中…</span>
    <span id="version-badge"></span>
    <span id="update-badge" class="update-badge hidden">可更新</span>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <button class="nav active" data-page="console">🖥 控制台</button>
      <button class="nav" data-page="update">⬆ 更新</button>
      <button class="nav" data-page="checks">🩺 体检</button>
      <button class="nav" data-page="uninstall">🗑 卸载</button>
      <button class="nav" data-page="about">ⓘ 关于</button>
    </aside>

    <main id="content">
      <!-- 控制台页：工具条 + 内嵌 DSH -->
      <section class="page active page-console" id="page-console">
        <div id="console-toolbar">
          <span id="console-state" class="muted">–</span>
          <div class="btn-group">
            <button id="btn-start" class="btn primary" onclick="UI.startDsh()">▶ 启动 dsh</button>
            <button id="btn-stop" class="btn danger" onclick="UI.stopDsh()">⏹ 停止</button>
            <button id="btn-refresh" class="btn" onclick="UI.refresh()">⟳ 刷新</button>
          </div>
        </div>
        <div id="embed-slot">
          <div id="embed-status">
            <div class="spinner"></div>
            <p class="muted">正在连接 127.0.0.1:3080 …</p>
            <p class="muted small" id="embed-error"></p>
            <button id="embed-retry" class="btn" onclick="UI.refreshEmbed()">重试</button>
          </div>
        </div>
      </section>

      <section class="page" id="page-update">
        <div class="card">
          <h2>版本更新</h2>
          <div id="update-box" class="muted">检查中…</div>
          <div id="update-log" class="log"></div>
        </div>
      </section>

      <section class="page" id="page-checks">
        <div class="card">
          <h2>环境体检</h2>
          <div id="checks-box" class="muted">检查中…</div>
        </div>
      </section>

      <section class="page" id="page-uninstall">
        <div class="card">
          <h2>卸载 dsh</h2>
          <p class="muted" id="uninstall-desc">…</p>
          <label class="chk"><input type="checkbox" id="chk-config" /> 同时清除用户配置（~/.dsh：profiles、会话记录）</label>
          <label class="chk"><input type="checkbox" id="chk-npx" /> 同时清理 npx 残留缓存（%LocalAppData%/npm-cache/_npx）</label>
          <button id="btn-uninstall" class="btn danger" onclick="UI.uninstall()">确认卸载</button>
          <div id="uninstall-log" class="log"></div>
        </div>
      </section>

      <section class="page" id="page-about">
        <div class="card">
          <h2>关于 dsh-up Desktop</h2>
          <p class="muted">独立外部工具（非插件）：DSH 启动器 + 内嵌显示器 + 版本/卸载管理器。</p>
          <p class="muted" id="about-version"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>

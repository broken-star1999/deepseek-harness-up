name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # 路径脱敏（与 scripts/make-release.ps1 同理）：重映射 runner 本机路径，产物不含用户名/目录
  # 前缀匹配不到时 rustc 自动跳过（等价未启用），不影响构建
  RUSTFLAGS: '--remap-path-prefix=C:\Users\runneradmin\.cargo=/cargo --remap-path-prefix=D:\a\deepseek-harness-up\deepseek-harness-up=/repo'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # dtolnay/rust-toolchain@stable

      - name: Build release exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "src-tauri/target/release/deepseek-harness-up.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  deepseek-harness-up.exe" | Set-Content -Encoding utf8 checksums.txt
          Get-Content checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: deepseek-harness-up
          path: src-tauri/target/release/deepseek-harness-up.exe
          if-no-files-found: error

      # 发布方式：本地构建后手动上传（scripts/make-release.ps1 + gh release upload）
      # 保留以下步骤备用于未来 CI 发布，当前不自动挂接避免覆盖手工上传的产物：
      # - name: Attach to GitHub Release
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     gh release upload "${{ github.ref_name }}" src-tauri/target/release/deepseek-harness-up.exe checksums.txt --clobber

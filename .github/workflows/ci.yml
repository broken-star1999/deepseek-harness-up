name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: npm audit
        run: npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # dtolnay/rust-toolchain@stable

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Tauri release build
        run: npm run build

      - name: Frontend syntax check
        run: node --check ui/main.js; node --check ui/controls.js; node --check ui/modal.js; node --check ui/settings.js

      - name: Project self-check
        shell: pwsh
        run: .\scripts\self-check.ps1

      - name: Version consistency check
        shell: pwsh
        run: |
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version').Line -replace '.*"([^"]+)".*','$1'
          $conf = (Select-String -Path src-tauri/tauri.conf.json -Pattern '"version"' | Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          $pkg = (Select-String -Path package.json -Pattern '"version"' | Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          if ($cargo.Trim() -ne $conf.Trim() -or $cargo.Trim() -ne $pkg.Trim()) { throw "版本不一致: cargo=$cargo conf=$conf pkg=$pkg" }
          Write-Output "版本一致: $($cargo.Trim())"

      - name: IPC/DOM sanity check
        shell: pwsh
        run: |
          # 前端 invoke 的名字必须精确出现在 generate_handler 列表中
          $rs = Get-Content src-tauri/src/lib.rs -Raw
          $handler = [regex]::Match($rs, 'generate_handler!\s*\[(?<body>[\s\S]*?)\]\s*\)')
          if (-not $handler.Success) { throw "未找到 generate_handler 列表" }
          $registered = [regex]::Matches($handler.Groups['body'].Value, '(?m)^\s*([a-z_][a-z0-9_]*)\s*(?:,|$)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $ui = (Get-ChildItem ui -Filter *.js | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $invokes = [regex]::Matches($ui, 'invoke\(\s*[\x27\x22]([a-z_][a-z0-9_]*)[\x27\x22]') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $missing = @()
          foreach ($name in $invokes) { if ($registered -notcontains $name) { $missing += $name } }
          if ($missing.Count -gt 0) { throw "IPC 契约断裂, 后端缺失: $($missing -join ', ')" }
          Write-Output ("IPC 检查通过: " + ($invokes -join ', '))

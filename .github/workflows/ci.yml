name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # dtolnay/rust-toolchain@stable

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Frontend syntax check
        run: node --check ui/main.js; node --check ui/controls.js; node --check ui/modal.js; node --check ui/settings.js

[package]
name = "dsh-up-desktop"
version = "0.1.0"
description = "DSH launcher & shell"
authors = ["dsh-up"]
edition = "2021"

[lib]
name = "dsh_up_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
semver = "1"

[profile.release]
strip = true
lto = true

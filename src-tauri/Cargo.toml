[package]
name = "deepseek-harness-up"
version = "0.2.3"
description = "DSH launcher & shell"
authors = ["dsh-up"]
edition = "2021"

[lib]
name = "deepseek_harness_up_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
semver = "1"

[profile.release]
strip = true
lto = "thin"